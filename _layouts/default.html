<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/assets/images/portrait.jpg' | absolute_url }}">
    {% if page.layout == 'post' %}
    <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
    {% endif %}
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)">
  </head>

  <body class="{{ page.body_class | default: page.layout | default: 'page' }}">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ '/' | relative_url }}">
          <img class="brand-photo" src="{{ '/assets/images/avatar.jpg' | relative_url }}" alt="" width="32" height="32">
          <span class="brand-name">{{ site.title }}</span>
        </a>

        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>文章</a>
          <a href="{{ '/about.html' | relative_url }}"{% if page.url == '/about.html' %} aria-current="page"{% endif %}>关于</a>
        </nav>
      </div>
    </header>

    <main id="main" class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>© {{ site.time | date: "%Y" }} {{ site.author.name | default: site.title }}</p>
        <p class="footer-links">
          <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
          <span aria-hidden="true">·</span>
          <span>微信 {{ site.author.wechat }}</span>
        </p>
      </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
